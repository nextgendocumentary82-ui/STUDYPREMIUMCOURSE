services:
  mongo:
    image: mongo:7
    restart: on-failure
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/study-premium-course
      - DONATION_DEV_OTP=true
      - BASE44_PREVIEW_MODE=1
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["sh", "-c", "npm install --omit=dev && npm install --no-save nodemon && exec npx nodemon --watch server.js server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  mongo_data:
  node_modules:
